services:
  app:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-$$agvz@6b8yog)w+z=m*59p3$$#eh19(02y(6paq(jb0jzf2b8&_}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      POSTGRES_DB: ${POSTGRES_DB:-djangoninja}
      POSTGRES_USER: ${POSTGRES_USER:-djangoninja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djangoninja}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      KINDE_CLIENT_ID: ${KINDE_CLIENT_ID:-}
      KINDE_CLIENT_SECRET: ${KINDE_CLIENT_SECRET:-}
      KINDE_HOST: ${KINDE_HOST:-}
      KINDE_ISSUER_URL: ${KINDE_ISSUER_URL:-}
      KINDE_REDIRECT_URI: ${KINDE_REDIRECT_URI:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-djangoninja}
      POSTGRES_USER: ${POSTGRES_USER:-djangoninja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djangoninja}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
