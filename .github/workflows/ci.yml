name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: djangoninja
          POSTGRES_USER: djangoninja
          POSTGRES_PASSWORD: djangoninja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djangoninja -d djangoninja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: djangoninja
      POSTGRES_USER: djangoninja
      POSTGRES_PASSWORD: djangoninja
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Django check
        run: python manage.py check

      - name: Migrate
        run: python manage.py migrate

      - name: Tests
        run: python manage.py test --verbosity=2
