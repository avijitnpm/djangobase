[project]
name = "djangoninja"
version = "0.1.0"
description = "Django modular-monolith platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1",
    "psycopg[binary]==3.3.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
